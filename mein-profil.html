<!DOCTYPE html>
<!-- Hier richtet man das eigene Profil ein und lädt Fotos hoch. -->
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unsere Hunde – Mein Profil</title>
  <!-- Bei Änderungen an style.css die Zahl erhöhen (v=11, v=12 ...) -->
  <link rel="stylesheet" href="style.css?v=11">

  <!-- Damit man die Seite als App installieren kann (PWA) -->
  <link rel="manifest" href="manifest.json?v=2">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Unsere Hunde">
  <script src="app.js?v=1"></script>

  <!-- Verbindung zur Datenbank -->
  <script src="lib/supabase-2.45.4.js"></script>
  <script src="db.js?v=2"></script>
</head>
<body>
  <div class="kopfzeile">
    <a href="index.html">← Alle Hunde</a>
    <a href="#" id="ansehen-link" hidden>Mein Profil ansehen →</a>
  </div>

  <h1>Mein Profil</h1>

  <!-- 1. Name und Profilbild vom eigenen Hund -->
  <div class="formular-kasten">
    <h2>Mein Hund</h2>

    <div class="profil-kopf">
      <!-- Auf das Bild tippen, um ein Profilbild auszuwählen -->
      <label for="profilbild-datei" class="bild-waehlen">
        <img id="profilbild-vorschau" src="" alt="Profilbild">
        <span>Bild ändern</span>
      </label>
      <input type="file" id="profilbild-datei" accept="image/*" hidden>
    </div>

    <label for="hundename-feld">Name von deinem Hund</label>
    <input type="text" id="hundename-feld" placeholder="z.B. Sammy">

    <button id="profil-speichern">Speichern</button>
  </div>

  <!-- 2. Neues Foto posten (erst, wenn der Hund gespeichert ist) -->
  <div class="formular-kasten" id="post-kasten" hidden>
    <h2>Neues Foto posten</h2>

    <label for="foto-datei" class="bild-waehlen foto-waehlen">
      <img id="foto-vorschau" src="" alt="" hidden>
      <span id="foto-hinweis">📷 Foto auswählen</span>
    </label>
    <input type="file" id="foto-datei" accept="image/*" hidden>

    <label for="beschreibung-feld">Beschreibung</label>
    <input type="text" id="beschreibung-feld" placeholder="Was macht dein Hund gerade?">

    <button id="posten">Posten</button>
  </div>

  <script>
    let ich = null;
    let meinHund = null; // aus der Datenbank, oder null, wenn es noch keinen gibt

    const profilbildVorschau = document.getElementById("profilbild-vorschau");
    const hundenameFeld = document.getElementById("hundename-feld");

    async function start() {
      ich = await brauchtAnmeldung();

      // Gibt es schon einen eigenen Hund?
      const { data, error } = await db.from("hunde").select("*").eq("besitzer", ich.id).maybeSingle();
      if (error) {
        fehler("Dein Profil konnte nicht geladen werden.", error);
        return;
      }
      meinHund = data;

      profilbildVorschau.src = LEERES_PROFILBILD;
      if (meinHund) {
        hundenameFeld.value = meinHund.name;
        if (meinHund.profilbild) profilbildVorschau.src = bildLink(meinHund.profilbild);
      }
      zeigeOderVersteckePosten();
    }

    // Posten geht erst, wenn der Hund gespeichert ist
    function zeigeOderVersteckePosten() {
      document.getElementById("post-kasten").hidden = !meinHund;
      const ansehen = document.getElementById("ansehen-link");
      ansehen.hidden = !meinHund;
      if (meinHund) ansehen.href = "profil.html?hund=" + meinHund.id;
    }

    // Knopf während dem Hochladen sperren
    function beschaeftigt(knopf, text) {
      knopf.disabled = text !== null;
      if (text !== null) {
        knopf.dataset.alt = knopf.textContent;
        knopf.textContent = text;
      } else {
        knopf.textContent = knopf.dataset.alt;
      }
    }

    // ----- Profilbild -----
    let neuesProfilbild = null;

    document.getElementById("profilbild-datei").addEventListener("change", async function () {
      const datei = this.files[0];
      if (!datei) return;
      // Profilbilder sind klein, 300 Pixel reichen
      neuesProfilbild = await verkleinereFoto(datei, 300);
      profilbildVorschau.src = URL.createObjectURL(neuesProfilbild);
    });

    document.getElementById("profil-speichern").addEventListener("click", async function () {
      const name = hundenameFeld.value.trim();
      if (name === "") {
        alert("Bitte gib den Namen von deinem Hund ein.");
        return;
      }
      const knopf = this;
      beschaeftigt(knopf, "Speichert ...");

      const aenderungen = { name: name };
      if (neuesProfilbild) {
        const pfad = await fotoHochladen(ich.id, neuesProfilbild, "profil");
        if (!pfad) { beschaeftigt(knopf, null); return; }
        aenderungen.profilbild = pfad;
      }

      // Neuer Hund oder bestehenden ändern?
      const anfrage = meinHund
        ? db.from("hunde").update(aenderungen).eq("id", meinHund.id)
        : db.from("hunde").insert(aenderungen);
      const { data, error } = await anfrage.select().single();

      beschaeftigt(knopf, null);
      if (error) {
        fehler("Dein Hund konnte nicht gespeichert werden.", error);
        return;
      }
      meinHund = data;
      neuesProfilbild = null;
      zeigeOderVersteckePosten();
      alert("Gespeichert!");
    });

    // ----- Neues Foto posten -----
    let neuesFoto = null;
    const fotoVorschau = document.getElementById("foto-vorschau");
    const fotoHinweis = document.getElementById("foto-hinweis");

    document.getElementById("foto-datei").addEventListener("change", async function () {
      const datei = this.files[0];
      if (!datei) return;
      // Post-Fotos dürfen etwas grösser sein: 1200 Pixel
      neuesFoto = await verkleinereFoto(datei, 1200);
      fotoVorschau.src = URL.createObjectURL(neuesFoto);
      fotoVorschau.hidden = false;
      fotoHinweis.textContent = "📷 Anderes Foto wählen";
    });

    document.getElementById("posten").addEventListener("click", async function () {
      if (!neuesFoto) {
        alert("Bitte wähle zuerst ein Foto aus.");
        return;
      }
      const knopf = this;
      beschaeftigt(knopf, "Lädt hoch ...");

      const pfad = await fotoHochladen(ich.id, neuesFoto, "post");
      if (!pfad) { beschaeftigt(knopf, null); return; }

      const { error } = await db.from("posts").insert({
        hund_id: meinHund.id,
        bild: pfad,
        beschreibung: document.getElementById("beschreibung-feld").value.trim(),
      });

      beschaeftigt(knopf, null);
      if (error) {
        fehler("Das Foto konnte nicht gepostet werden.", error);
        return;
      }
      // Direkt zum eigenen Profil, dort ist das neue Foto zuoberst
      window.location.href = "profil.html?hund=" + meinHund.id;
    });

    start();
  </script>
</body>
</html>
