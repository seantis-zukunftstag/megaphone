<!DOCTYPE html>
<!-- Das ist unsere Startseite: die Anmeldung. GitHub Pages zeigt automatisch die Datei "index.html" an. -->
<html lang="de">
<head>
  <!-- Damit Umlaute wie ä, ö, ü richtig angezeigt werden -->
  <meta charset="UTF-8">
  <!-- Damit die Seite auch auf dem Handy gut aussieht -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Dieser Titel steht oben im Browser-Tab -->
  <title>Megaphone – Anmelden</title>
  <!-- Hier holen wir unsere Stil-Datei. Bei Änderungen an style.css die Zahl erhöhen (v=9, v=10 ...) -->
  <link rel="stylesheet" href="style.css?v=8">

  <!-- Damit man die Seite als App installieren kann (PWA) -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Megaphone">
  <script src="app.js?v=1"></script>

  <script>
    // Wer schon angemeldet ist, kommt direkt zur Übersicht
    if (localStorage.getItem("name")) {
      window.location.replace("uebersicht.html");
    }
  </script>
</head>
<body>
  <!-- Alles im "body" sieht man auf der Seite -->
  <h1>Hallo!</h1>

  <!-- Hier meldet man sich mit seinem Namen an -->
  <div class="name-eingabe">
    <input type="text" id="name" placeholder="Dein Name">
    <button onclick="anmelden()">Los!</button>
  </div>

  <!-- Erscheint nur, wenn das Handy die App installieren kann -->
  <div class="name-eingabe">
    <button class="installieren-knopf" onclick="appInstallieren()" hidden>📲 App installieren</button>
  </div>

  <script>
    // Diese Funktion wird ausgeführt, wenn man auf "Los!" klickt
    function anmelden() {
      // Den Namen aus dem Eingabefeld holen (Leerzeichen am Rand weglassen)
      const name = document.getElementById("name").value.trim();

      // Ohne Namen geht es nicht weiter
      if (name === "") {
        alert("Bitte gib deinen Namen ein.");
        return;
      }

      // Den Namen im Browser speichern, damit die Übersichtsseite ihn kennt
      localStorage.setItem("name", name);

      // Weiter zur Übersichtsseite
      window.location.href = "uebersicht.html";
    }

    // Damit es auch mit der Enter-Taste funktioniert
    document.getElementById("name").addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        anmelden();
      }
    });
  </script>
</body>
</html>
