<!DOCTYPE html>
<!-- Das ist unsere Startseite. GitHub Pages zeigt automatisch die Datei "index.html" an. -->
<html lang="de">
<head>
  <!-- Damit Umlaute wie ä, ö, ü richtig angezeigt werden -->
  <meta charset="UTF-8">
  <!-- Damit die Seite auch auf dem Handy gut aussieht -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Dieser Titel steht oben im Browser-Tab -->
  <title>Megaphone</title>
  <!-- Hier holen wir unsere Stil-Datei, damit die Seite schön aussieht -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Alles im "body" sieht man auf der Seite -->
  <h1>Unsere Hunde</h1>

  <!-- Die Liste mit allen Hunde-Profilen -->
  <!-- Für einen neuen Hund: einen ganzen <li>...</li>-Block kopieren und Bild + Name ändern -->
  <ul class="profile">

    <li class="profil">
      <img src="bilder/bello.jpg" alt="Foto von Bello">
      <span class="hundename">Bello</span>
    </li>

    <li class="profil">
      <img src="bilder/luna.jpg" alt="Foto von Luna">
      <span class="hundename">Luna</span>
    </li>

    <li class="profil">
      <img src="bilder/max.jpg" alt="Foto von Max">
      <span class="hundename">Max</span>
    </li>

    <li class="profil">
      <img src="bilder/kira.jpg" alt="Foto von Kira">
      <span class="hundename">Kira</span>
    </li>

    <li class="profil">
      <img src="bilder/rocky.jpg" alt="Foto von Rocky">
      <span class="hundename">Rocky</span>
    </li>

  </ul>
</body>
</html>
