<!DOCTYPE html>
<!-- Das ist unsere Startseite: die Anmeldung. GitHub Pages zeigt automatisch die Datei "index.html" an. -->
<html lang="de">
<head>
  <!-- Damit Umlaute wie ä, ö, ü richtig angezeigt werden -->
  <meta charset="UTF-8">
  <!-- Damit die Seite auch auf dem Handy gut aussieht -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Dieser Titel steht oben im Browser-Tab -->
  <title>Megaphone – Anmelden</title>
  <!-- Hier holen wir unsere Stil-Datei. Bei Änderungen an style.css die Zahl erhöhen (v=8, v=9 ...) -->
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <!-- Alles im "body" sieht man auf der Seite -->
  <h1>Hallo!</h1>

  <!-- Hier meldet man sich mit seinem Namen an -->
  <div class="name-eingabe">
    <input type="text" id="name" placeholder="Dein Name">
    <button onclick="anmelden()">Los!</button>
  </div>

  <script>
    // Diese Funktion wird ausgeführt, wenn man auf "Los!" klickt
    function anmelden() {
      // Den Namen aus dem Eingabefeld holen (Leerzeichen am Rand weglassen)
      const name = document.getElementById("name").value.trim();

      // Ohne Namen geht es nicht weiter
      if (name === "") {
        alert("Bitte gib deinen Namen ein.");
        return;
      }

      // Den Namen im Browser speichern, damit die Übersichtsseite ihn kennt
      localStorage.setItem("name", name);

      // Weiter zur Übersichtsseite
      window.location.href = "uebersicht.html";
    }

    // Damit es auch mit der Enter-Taste funktioniert
    document.getElementById("name").addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        anmelden();
      }
    });
  </script>
</body>
</html>
