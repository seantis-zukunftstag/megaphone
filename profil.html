<!DOCTYPE html>
<!-- Das ist die Profilseite von einem Hund. Welcher Hund, steht in der Adresse: profil.html?hund=...
     Alle dürfen sie sehen. Kommentieren und abstimmen geht nur angemeldet. -->
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unsere Hunde – Profil</title>
  <!-- Bei Änderungen an style.css die Zahl erhöhen (v=11, v=12 ...) -->
  <link rel="stylesheet" href="style.css?v=12">

  <!-- Damit man die Seite als App installieren kann (PWA) -->
  <link rel="manifest" href="manifest.json?v=2">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Unsere Hunde">
  <script src="app.js?v=2"></script>

  <!-- Verbindung zur Datenbank -->
  <script src="lib/supabase-2.45.4.js"></script>
  <script src="db.js?v=2"></script>
</head>
<body>
  <!-- Oben: Zurück-Link -->
  <div class="kopfzeile">
    <a href="index.html">← Alle Hunde</a>
    <!-- Nur beim eigenen Hund sichtbar -->
    <a href="mein-profil.html" id="bearbeiten-link" hidden>📷 Foto posten</a>
  </div>

  <!-- Profilbild und Name vom Hund -->
  <div class="profil-kopf">
    <img id="profilbild" src="" alt="" hidden>
    <h1 id="hundename">Lade ...</h1>
  </div>

  <!-- Hier kommen alle Posts hinein, das neuste zuerst -->
  <div id="posts"></div>

  <script>
    let ich = null; // null = niemand angemeldet

    async function start() {
      // Wer ist angemeldet? (Die Seite ist auch ohne Anmeldung sichtbar)
      ich = await aktuellerBenutzer();

      // Welcher Hund? Das steht in der Adresse nach "?hund="
      const hundId = new URLSearchParams(window.location.search).get("hund");

      // Den Hund und seine Posts holen (das neuste zuerst)
      const [hundAntwort, postAntwort] = await Promise.all([
        db.from("hunde").select("*").eq("id", hundId).maybeSingle(),
        db.from("posts").select("*").eq("hund_id", hundId).order("erstellt", { ascending: false }),
      ]);
      const hund = hundAntwort.data;
      const posts = postAntwort.data || [];

      if (!hund) {
        document.getElementById("hundename").textContent = "Hund nicht gefunden";
        return;
      }

      // Kommentare und Stimmen zu allen Posts holen
      const postIds = posts.map(function (p) { return p.id; });
      const [kommentarAntwort, stimmenAntwort] = await Promise.all([
        db.from("kommentare").select("*").in("post_id", postIds).order("erstellt"),
        db.from("stimmen").select("*").in("post_id", postIds),
      ]);
      const kommentare = kommentarAntwort.data || [];
      const stimmen = stimmenAntwort.data || [];

      // Name und Profilbild oben anzeigen
      document.getElementById("hundename").textContent = hund.name;
      const profilbild = document.getElementById("profilbild");
      profilbild.src = bildLink(hund.profilbild) || LEERES_PROFILBILD;
      profilbild.alt = "Foto von " + hund.name;
      profilbild.hidden = false;
      document.title = "Unsere Hunde – " + hund.name;

      // Beim eigenen Hund: Link zum Fotos-Posten zeigen
      if (ich && hund.besitzer === ich.id) {
        document.getElementById("bearbeiten-link").hidden = false;
      }
      if (posts.length === 0) {
        const leer = document.createElement("p");
        leer.className = "hinweis";
        leer.textContent = "Noch keine Fotos.";
        document.getElementById("posts").appendChild(leer);
      }

      // Jeden Post auf die Seite bringen
      for (const post of posts) {
        zeigePost(
          post,
          bildLink(post.bild),
          kommentare.filter(function (k) { return k.post_id === post.id; }),
          stimmen.filter(function (s) { return s.post_id === post.id; })
        );
      }
    }

    // Baut einen Post zusammen: Bild, Beschreibung, Daumen, Kommentare und Eingabefeld
    function zeigePost(post, bildLink, kommentare, stimmen) {
      const kasten = document.createElement("div");
      kasten.className = "post";

      // 1. Das Bild
      const bild = document.createElement("img");
      bild.src = bildLink || "";
      bild.alt = post.beschreibung;
      kasten.appendChild(bild);

      // 2. Die Beschreibung
      const beschreibung = document.createElement("p");
      beschreibung.className = "beschreibung";
      beschreibung.textContent = post.beschreibung;
      kasten.appendChild(beschreibung);

      // Das Datum, klein darunter
      const datum = document.createElement("p");
      datum.className = "datum";
      datum.textContent = new Date(post.erstellt).toLocaleDateString("de-CH");
      kasten.appendChild(datum);

      // Daumen hoch, Daumen runter und Herz
      const daumen = document.createElement("div");
      daumen.className = "daumen";
      const knopfHoch = document.createElement("button");
      const knopfRunter = document.createElement("button");
      const knopfHerz = document.createElement("button");
      knopfHerz.className = "herz";
      daumen.appendChild(knopfHoch);
      daumen.appendChild(knopfRunter);
      daumen.appendChild(knopfHerz);
      kasten.appendChild(daumen);

      // Meine eigene Stimme bei diesem Post (oder eine leere)
      function meineStimme() {
        const leer = { daumen: null, herz: false };
        if (!ich) return leer;
        return stimmen.find(function (s) { return s.besitzer === ich.id; }) || leer;
      }

      // Zahlen anzeigen und markieren, was man selbst gewählt hat
      function zeigeStimmen() {
        const meine = meineStimme();
        const zaehle = function (pruefen) { return stimmen.filter(pruefen).length; };
        knopfHoch.textContent = "👍 " + zaehle(function (s) { return s.daumen === "hoch"; });
        knopfRunter.textContent = "👎 " + zaehle(function (s) { return s.daumen === "runter"; });
        knopfHerz.textContent = (meine.herz ? "❤️ " : "🤍 ") + zaehle(function (s) { return s.herz; });
        knopfHoch.classList.toggle("gewaehlt", meine.daumen === "hoch");
        knopfRunter.classList.toggle("gewaehlt", meine.daumen === "runter");
        knopfHerz.classList.toggle("gewaehlt", meine.herz);
      }

      // Neue Stimme in der Datenbank speichern
      async function speichereStimme(daumenWahl, herz) {
        // Abstimmen geht nur angemeldet
        if (!ich) {
          window.location.href = anmeldenLink();
          return;
        }
        let antwort;
        if (daumenWahl === null && !herz) {
          // Nichts mehr gewählt: Stimme löschen
          antwort = await db.from("stimmen").delete().eq("post_id", post.id).eq("besitzer", ich.id);
        } else {
          antwort = await db.from("stimmen").upsert({
            post_id: post.id,
            besitzer: ich.id,
            daumen: daumenWahl,
            herz: herz,
          });
        }
        if (antwort.error) {
          fehler("Die Stimme konnte nicht gespeichert werden.", antwort.error);
          return;
        }
        // Auch hier auf der Seite nachführen
        stimmen = stimmen.filter(function (s) { return s.besitzer !== ich.id; });
        if (daumenWahl !== null || herz) {
          stimmen.push({ post_id: post.id, besitzer: ich.id, daumen: daumenWahl, herz: herz });
        }
        zeigeStimmen();
      }

      // Jeder darf pro Bild nur einmal abstimmen.
      // Nochmals auf denselben Daumen klicken nimmt die Stimme wieder weg.
      knopfHoch.addEventListener("click", function () {
        const meine = meineStimme();
        speichereStimme(meine.daumen === "hoch" ? null : "hoch", meine.herz);
      });
      knopfRunter.addEventListener("click", function () {
        const meine = meineStimme();
        speichereStimme(meine.daumen === "runter" ? null : "runter", meine.herz);
      });
      knopfHerz.addEventListener("click", function () {
        const meine = meineStimme();
        speichereStimme(meine.daumen, !meine.herz);
      });
      zeigeStimmen();

      // 3. Die Kommentare
      const liste = document.createElement("ul");
      liste.className = "kommentare";
      kasten.appendChild(liste);
      for (const kommentar of kommentare) {
        zeigeKommentar(liste, kommentar);
      }

      // 4. Neuen Kommentar schreiben (nur angemeldet)
      if (!ich) {
        const hinweis = document.createElement("p");
        hinweis.className = "kommentar-eingabe";
        const link = document.createElement("a");
        link.href = anmeldenLink();
        link.textContent = "Anmelden, um zu kommentieren";
        hinweis.appendChild(link);
        kasten.appendChild(hinweis);
        document.getElementById("posts").appendChild(kasten);
        return;
      }
      const formular = document.createElement("form");
      formular.className = "kommentar-eingabe";
      const feld = document.createElement("input");
      feld.type = "text";
      feld.placeholder = "Kommentar schreiben ...";
      const knopf = document.createElement("button");
      knopf.type = "submit";
      knopf.textContent = "Senden";
      formular.appendChild(feld);
      formular.appendChild(knopf);
      kasten.appendChild(formular);

      // Wenn man auf "Senden" klickt (oder Enter drückt)
      formular.addEventListener("submit", async function (event) {
        event.preventDefault(); // Seite nicht neu laden
        const text = feld.value.trim();
        if (text === "") return;

        knopf.disabled = true;
        const { data, error } = await db
          .from("kommentare")
          .insert({ post_id: post.id, von: ich.name, text: text })
          .select()
          .single();
        knopf.disabled = false;
        if (error) {
          fehler("Der Kommentar konnte nicht gespeichert werden.", error);
          return;
        }
        zeigeKommentar(liste, data);
        feld.value = "";
      });

      document.getElementById("posts").appendChild(kasten);
    }

    // Zeigt einen Kommentar in der Liste an, z.B. "Anna: So süss!"
    function zeigeKommentar(liste, kommentar) {
      const eintrag = document.createElement("li");
      const von = document.createElement("strong");
      von.textContent = kommentar.von + ": ";
      eintrag.appendChild(von);
      eintrag.appendChild(document.createTextNode(kommentar.text));
      liste.appendChild(eintrag);
    }

    start();
  </script>
</body>
</html>
