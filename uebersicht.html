<!DOCTYPE html>
<!-- Das ist die Übersichtsseite mit allen Hunden. Man kommt hierher, nachdem man sich angemeldet hat. -->
<html lang="de">
<head>
  <!-- Damit Umlaute wie ä, ö, ü richtig angezeigt werden -->
  <meta charset="UTF-8">
  <!-- Damit die Seite auch auf dem Handy gut aussieht -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Dieser Titel steht oben im Browser-Tab -->
  <title>Megaphone</title>
  <!-- Hier holen wir unsere Stil-Datei, damit die Seite schön aussieht -->
  <!-- "?v=8": Wenn ihr style.css ändert und hochladet, erhöht die Zahl (v=9, v=10 ...).
       Dann holt jedes Handy sicher die neue Version und nicht eine alte, gespeicherte. -->
  <link rel="stylesheet" href="style.css?v=8">

  <!-- Damit man die Seite als App installieren kann (PWA) -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Megaphone">
  <script src="app.js?v=1"></script>

  <!-- Die Daten von allen Hunden und vom eigenen Hund -->
  <script src="hunde.js?v=1"></script>
  <script src="mein-hund.js?v=1"></script>

  <script>
    // Den Namen holen, den man bei der Anmeldung eingegeben hat
    const benutzername = localStorage.getItem("name");
    // Wer nicht angemeldet ist, kommt zurück zur Anmeldung
    if (!benutzername) {
      window.location.href = "index.html";
    }
  </script>
</head>
<body>
  <!-- Alles im "body" sieht man auf der Seite -->

  <!-- Oben: Begrüssung und Abmelden -->
  <div class="kopfzeile">
    <span id="begruessung"></span>
    <span>
      <a href="mein-profil.html">Mein Profil</a>
      ·
      <a href="#" onclick="abmelden()">Abmelden</a>
    </span>
  </div>

  <h1>Unsere Hunde</h1>

  <!-- Erscheint nur, wenn das Handy die App installieren kann -->
  <div class="name-eingabe">
    <button class="installieren-knopf" onclick="appInstallieren()" hidden>📲 App installieren</button>
  </div>

  <!-- Die Liste mit allen Hunde-Profilen -->
  <!-- Für einen neuen Hund: einen ganzen <li>...</li>-Block kopieren und Bild + Name ändern.
       Bei "hund=" kommt der Name aus hunde.js hin. -->
  <ul class="profile">

    <li class="profil">
      <a href="profil.html?hund=bello">
        <img src="bilder/bello.jpg" alt="Foto von Bello">
        <span class="hundename">Bello</span>
      </a>
    </li>

    <li class="profil">
      <a href="profil.html?hund=luna">
        <img src="bilder/luna.jpg" alt="Foto von Luna">
        <span class="hundename">Luna</span>
      </a>
    </li>

    <li class="profil">
      <a href="profil.html?hund=max">
        <img src="bilder/max.jpg" alt="Foto von Max">
        <span class="hundename">Max</span>
      </a>
    </li>

    <li class="profil">
      <a href="profil.html?hund=kira">
        <img src="bilder/kira.jpg" alt="Foto von Kira">
        <span class="hundename">Kira</span>
      </a>
    </li>

    <li class="profil">
      <a href="profil.html?hund=rocky">
        <img src="bilder/rocky.jpg" alt="Foto von Rocky">
        <span class="hundename">Rocky</span>
      </a>
    </li>

  </ul>

  <script>
    // "Hallo" und den Namen oben auf die Seite schreiben
    document.getElementById("begruessung").textContent = "Hallo " + benutzername;

    // Wenn es schon einen eigenen Hund gibt: ganz oben in die Liste setzen
    if (hunde.mein) {
      const eintrag = document.createElement("li");
      eintrag.className = "profil mein-profil";
      const link = document.createElement("a");
      link.href = "profil.html?hund=mein";
      const bild = document.createElement("img");
      bild.src = hunde.mein.profilbild;
      bild.alt = "Foto von " + hunde.mein.name;
      const name = document.createElement("span");
      name.className = "hundename";
      name.textContent = hunde.mein.name + " (mein Hund)";
      link.appendChild(bild);
      link.appendChild(name);
      eintrag.appendChild(link);
      const liste = document.querySelector(".profile");
      liste.insertBefore(eintrag, liste.firstChild);
    }

    // Beim Abmelden den Namen vergessen und zurück zur Anmeldung
    function abmelden() {
      localStorage.removeItem("name");
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
